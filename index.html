<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ノーリー レンチキュラー</title>
<style>
:root{--p:6px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
.card{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.masked{-webkit-mask-image:repeating-linear-gradient(90deg,#000 0 var(--w,0px),transparent var(--w,0px) var(--p));
        mask-image:repeating-linear-gradient(90deg,#000 0 var(--w,0px),transparent var(--w,0px) var(--p))}
.lens{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.35;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px calc(var(--p) - 1px),rgba(0,0,0,.35) calc(var(--p) - 1px) var(--p))}
.sheen{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 47%,rgba(170,210,255,.18) 52%,transparent 64%);
  transform:translateX(calc(var(--t,0) * 38%))}
</style>
</head>
<body>
<div class="card" id="card">
  <img class="layer" alt="">
  <img class="layer masked" alt="">
  <img class="layer masked" alt="">
  <div class="lens"></div><div class="sheen"></div>
</div>
<script>
(function(){
  // 絵柄セット：左に傾けた時 → 正面 → 右に傾けた時。URL末尾 #odaiba でお台場セット
  const SETS={
    neon:['neon-1.jpg','neon-2.jpg','neon-3.jpg'],
    odaiba:['odaiba-1.jpg','odaiba-2.jpg','odaiba-3.jpg']
  };
  const card=document.getElementById('card');
  const layers=[...card.querySelectorAll('.layer')];
  const P=6, SOFT=.30, RANGE=18;
  let target=0, cur=0, base=null, gyro=false, dragX=null, dragT=0;

  function useSet(){ const k=location.hash.slice(1); (SETS[k]||SETS.neon).forEach((s,i)=>layers[i].src=s); }
  useSet(); addEventListener('hashchange',useSet);

  const smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  const setT=v=>{target=Math.max(-1,Math.min(1,v));};
  (function loop(){
    cur+=(target-cur)*.2;
    const n=layers.length, pos=(cur+1)/2;
    for(let i=1;i<n;i++){ const b=i/n,w=SOFT/n; layers[i].style.setProperty('--w',(smooth((pos-(b-w/2))/w)*P).toFixed(2)+'px'); }
    card.style.setProperty('--t',cur.toFixed(3));
    requestAnimationFrame(loop);
  })();

  function tiltOf(e){
    const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    if(ang===90) return e.beta; if(ang===-90||ang===270) return -e.beta; return e.gamma;
  }
  function onOrient(e){ if(e.gamma==null) return; gyro=true; const g=tiltOf(e); if(base===null) base=g; setT((g-base)/RANGE); }
  const needsPermission=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
  if(!needsPermission) addEventListener('deviceorientation',onOrient); // Android等は自動で開始

  // 画面タップ：iPhoneはここでセンサー許可、許可後は今の角度を中央に戻す
  // iPhoneの許可ダイアログは「タップ完了(click/touchend)」の時しか出せないため、そこで依頼する
  let asked=false;
  function askPermission(){
    if(!needsPermission||gyro||asked) return;
    asked=true;
    DeviceOrientationEvent.requestPermission().then(r=>{
      if(r==='granted') addEventListener('deviceorientation',onOrient); else asked=false;
    }).catch(()=>{asked=false;});
  }
  // 確認用：URLに ?debug を付けると状態を表示
  if(/debug/.test(location.search)){
    const d=document.createElement('pre');
    d.style.cssText='position:fixed;left:8px;top:40px;z-index:9;margin:0;padding:8px;background:rgba(0,0,0,.7);color:#0f0;font:12px monospace;white-space:pre-wrap;max-width:90vw';
    document.body.append(d);
    let ev=0,last=null,perm='未',err='';
    addEventListener('deviceorientation',e=>{ev++;last=e.gamma;});
    const orig=askPermission;
    askPermission=function(){
      if(needsPermission){ DeviceOrientationEvent.requestPermission().then(r=>{perm=r;if(r==='granted')addEventListener('deviceorientation',onOrient);}).catch(x=>{perm='エラー';err=String(x&&x.message||x);}); }
      else perm='不要';
    };
    setInterval(()=>{d.textContent='版: v3\n許可が必要: '+needsPermission+'\n許可結果: '+perm+' '+err+'\nセンサー受信: '+ev+'回\ngamma: '+(last==null?'-':last.toFixed(1))+'\ngyro: '+gyro+'\nhttps: '+(location.protocol==='https:')+'\nUA: '+navigator.userAgent;},300);
  }
  card.addEventListener('click',()=>askPermission());
  card.addEventListener('touchend',()=>askPermission());
  if(false)
  card.addEventListener('touchend',askPermission);
  card.addEventListener('pointerdown',e=>{
    if(gyro){ base=null; return; }
    dragX=e.clientX; dragT=target;
  });
  card.addEventListener('pointermove',e=>{
    if(gyro) return;
    if(e.pointerType==='mouse'&&dragX===null){ setT((e.clientX/innerWidth)*2-1); return; }
    if(dragX!==null) setT(dragT+(e.clientX-dragX)/(innerWidth*.6));
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>card.addEventListener(t,()=>dragX=null));
})();
</script>
</body>
</html>
