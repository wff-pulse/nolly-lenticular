<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d1c">
<title>ノーリー レンチキュラー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--bg:#120d1c;--fg:#f6f0ff;--muted:#b9b0cc;--accent:#ff9a4d;--f:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;--p:6px;--ar:2/3}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.stage{perspective:900px;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
.card{position:relative;height:100%;aspect-ratio:var(--ar);max-width:100%;border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 24px 50px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08);transform:rotateY(calc(var(--t,0) * 12deg))}
@supports not (aspect-ratio:1){.card{width:100%}}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.masked{-webkit-mask-image:repeating-linear-gradient(90deg,#000 0 var(--w,0px),transparent var(--w,0px) var(--p));
        mask-image:repeating-linear-gradient(90deg,#000 0 var(--w,0px),transparent var(--w,0px) var(--p))}
.lens{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.35;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px calc(var(--p) - 1px),rgba(0,0,0,.35) calc(var(--p) - 1px) var(--p))}
.sheen{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 47%,rgba(170,210,255,.18) 52%,transparent 64%);
  transform:translateX(calc(var(--t,0) * 38%))}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s}
.dots i.on{background:var(--accent)}
.hint{margin:0;font-size:.82rem;color:var(--muted);text-align:center;min-height:1.4em}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
.tabs button{font:inherit;font-size:.85rem;border:0;border-radius:999px;padding:7px 16px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(18,13,28,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;padding:24px;z-index:5}
.start h1{margin:0;font-size:1.6rem;font-weight:700}
.start p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.7}
.start button{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:999px;padding:14px 32px;background:var(--accent);color:#2a1406;cursor:pointer}
.start .sub{background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;padding:6px 12px;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="card" id="card">
      <img class="layer" alt="">
      <img class="layer masked" alt="">
      <img class="layer masked" alt="">
      <div class="lens"></div><div class="sheen"></div>
    </div>
  </div>
  <div class="dots" id="dots"><i></i><i></i><i></i></div>
  <p class="hint" id="hint">スマホを左右に傾けてね</p>
  <div class="tabs" role="group" aria-label="絵柄">
    <button type="button" data-set="neon" aria-pressed="true">ネオンの街</button>
    <button type="button" data-set="odaiba" aria-pressed="false">お台場</button>
  </div>
</div>

<div class="start" id="start">
  <h1>ノーリー レンチキュラー</h1>
  <p>スマホを左右に傾けると<br>ノーリーの絵が切り替わるよ</p>
  <button id="go" type="button">タップしてスタート</button>
  <button id="nogyro" class="sub" type="button">指でスライドして見る</button>
</div>

<script>
(function(){
  // 絵柄セット：左に傾けた時 → 正面 → 右に傾けた時 の順
  const SETS={
    neon:{ar:'941/1672',imgs:['neon-1.jpg','neon-2.jpg','neon-3.jpg'],alts:['空を見上げるノーリー','こちらを見るノーリー','ウインクするノーリー']},
    odaiba:{ar:'2/3',imgs:['odaiba-1.jpg','odaiba-2.jpg','odaiba-3.jpg'],alts:['昼のお台場とノーリー','夕焼けのお台場とノーリー','眠るノーリー']}
  };
  const card=document.getElementById('card'), stage=document.getElementById('stage'), hint=document.getElementById('hint');
  const layers=[...card.querySelectorAll('.layer')], dots=[...document.querySelectorAll('#dots i')];
  const P=6, SOFT=.30, RANGE=18; // RANGE: 左右それぞれ何度傾けると端まで行くか
  let target=0, cur=0, base=null, mode='touch', dragX=null, dragT=0;

  function useSet(key){
    const s=SETS[key]; if(!s) return;
    document.documentElement.style.setProperty('--ar',s.ar);
    layers.forEach((l,i)=>{ l.src=s.imgs[i]; l.alt=s.alts[i]; });
    document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===key));
    // 先読み
    Object.values(SETS).forEach(o=>o.imgs.forEach(src=>{const im=new Image();im.src=src;}));
  }
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>useSet(b.dataset.set)));
  const start=(location.hash.slice(1) in SETS)?location.hash.slice(1):'neon';
  useSet(start);

  const smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  const setT=v=>{target=Math.max(-1,Math.min(1,v));};
  function render(){
    const n=layers.length, pos=(cur+1)/2;
    for(let i=1;i<n;i++){ const b=i/n,w=SOFT/n; layers[i].style.setProperty('--w',(smooth((pos-(b-w/2))/w)*P).toFixed(2)+'px'); }
    card.style.setProperty('--t',cur.toFixed(3));
    const a=Math.min(n-1,Math.floor(pos*n)); dots.forEach((d,i)=>d.classList.toggle('on',i===a));
  }
  (function loop(){ cur+=(target-cur)*.2; render(); requestAnimationFrame(loop); })();

  function tiltOf(e){
    const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    if(ang===90) return e.beta; if(ang===-90||ang===270) return -e.beta; return e.gamma;
  }
  function onOrient(e){ if(e.gamma==null) return; const g=tiltOf(e); if(base===null) base=g; setT((g-base)/RANGE); }

  async function startGyro(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
        if(await DeviceOrientationEvent.requestPermission()!=='granted') throw 0;
      }
      let got=false; const probe=e=>{if(e.gamma!=null)got=true;};
      addEventListener('deviceorientation',probe); addEventListener('deviceorientation',onOrient);
      mode='gyro'; hint.textContent='スマホを左右に傾けてね（絵をタップで今の角度を中央に）';
      setTimeout(()=>{ removeEventListener('deviceorientation',probe);
        if(!got){ removeEventListener('deviceorientation',onOrient); mode='touch'; hint.textContent='傾きセンサーが使えないので、指で左右にスライドしてね'; } },1500);
    }catch(_){ mode='touch'; hint.textContent='センサーが許可されなかったので、指で左右にスライドしてね'; }
  }
  document.getElementById('go').addEventListener('click',()=>{ document.getElementById('start').hidden=true; startGyro(); });
  document.getElementById('nogyro').addEventListener('click',()=>{ document.getElementById('start').hidden=true; hint.textContent='指で左右にスライドしてね'; });

  stage.addEventListener('pointerdown',e=>{ if(mode==='gyro'){ base=null; return; } dragX=e.clientX; dragT=target; });
  stage.addEventListener('pointermove',e=>{
    if(mode==='gyro') return;
    if(e.pointerType==='mouse'&&dragX===null){ const r=card.getBoundingClientRect(); setT(((e.clientX-r.left)/r.width)*2-1); return; }
    if(dragX!==null) setT(dragT+(e.clientX-dragX)/(card.offsetWidth*.6));
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>stage.addEventListener(t,()=>dragX=null));
})();
</script>
</body>
</html>
