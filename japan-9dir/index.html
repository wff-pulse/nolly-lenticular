<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ノーリー レンチキュラー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
.card{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* レンズの筋（縦）＋うっすら横の筋：縦横どちらに傾けても変わるレンズ */
.ridges{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.55;
  background-image:linear-gradient(90deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(255,255,255,0) 40%,rgba(255,255,255,.75) 52%,rgba(255,255,255,0) 64%,rgba(0,0,0,0) 80%,rgba(0,0,0,.5) 100%);
  background-size:var(--p,4px) 100%;background-position:calc(var(--hl,0) * var(--p,4px)) 0}
.ridgesH{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.25;
  background-image:linear-gradient(0deg,rgba(0,0,0,.5) 0,rgba(0,0,0,0) 25%,rgba(255,255,255,.6) 50%,rgba(0,0,0,0) 75%,rgba(0,0,0,.5) 100%);
  background-size:100% var(--p,4px);background-position:0 calc(var(--hlv,0) * var(--p,4px))}
.rainbow{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;
  background:linear-gradient(130deg,transparent 20%,rgba(255,0,128,.55) 30%,rgba(255,200,0,.55) 38%,rgba(0,255,160,.55) 46%,rgba(0,170,255,.55) 54%,rgba(160,0,255,.55) 62%,transparent 72%);
  transform:translate(calc(var(--t,0) * 40%),calc(var(--v,0) * 30%))}
.glare{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 48%,rgba(255,255,255,.05) 53%,transparent 58%);
  transform:translate(calc(var(--t,0) * -55%),calc(var(--v,0) * -35%))}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(0,0,0,.35) 100%)}
</style>
</head>
<body>
<div class="card" id="card" onclick="void 0">
  <canvas id="cv"></canvas>
  <div class="ridges"></div><div class="ridgesH"></div><div class="rainbow"></div><div class="glare"></div><div class="vignette"></div>
</div>
<script>
(function(){
  /* ===== 作品ごとの設定 =====
     GRID：傾けた方向に出る絵（上段＝奥に倒す／下段＝手前に倒す、左列＝左に倒す／右列＝右に倒す）
     日本地図のおおよその方角：中央＝富士山（中部） */
  var GRID=[
    ['kenrokuen.jpg', 'nebuta.jpg',  'goryokaku.jpg'],  // 北西：兼六園   北：ねぶた祭   北東：五稜郭
    ['dotonbori.jpg', 'fuji.jpg',    'tower.jpg'],      // 西：道頓堀     中央：富士山   東：東京タワー
    ['akiyoshidai.jpg','churaumi.jpg','takeshita.jpg']  // 南西：秋吉台   南：美ら海     南東：竹下通り
  ];
  var LOOK={
    pitch:4,       // レンズ1本の幅（px）
    degX:13,       // 左右：何度傾けると隣の絵になるか
    degY:13,       // 前後：何度傾けると隣の絵になるか
    sweep:.45,     // 切り替わりが画面を流れる強さ
    ghost:.08,     // 隣の絵がうっすら残る強さ
    parallax:.015  // 傾けた時に絵がわずかにずれる量
  };
  /* ========================= */
  var card=document.getElementById('card'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var rows=GRID.length, cols=GRID[0].length;
  var imgs={}, scaled={}, W=0,H=0,DPR=1, ex=0, ey=0;
  var off=document.createElement('canvas'), octx=off.getContext('2d');
  var cx=(cols-1)/2, cy=(rows-1)/2, tx=cx, ty=cy, curX=cx, curY=cy;
  var base=null, baseB=null, events=0, lastG=null, lastB=null, perm='未';
  card.style.setProperty('--p',LOOK.pitch+'px');

  var list=[]; GRID.forEach(function(r){r.forEach(function(s){ if(list.indexOf(s)<0) list.push(s); });});
  function prepare(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.round(innerWidth*DPR); H=Math.round(innerHeight*DPR);
    cv.width=off.width=W; cv.height=off.height=H;
    ex=Math.round(W*LOOK.parallax*2); ey=Math.round(H*LOOK.parallax*2);
    list.forEach(function(s){
      var im=imgs[s]; var c=document.createElement('canvas'); c.width=W+ex*2; c.height=H+ey*2;
      var g=c.getContext('2d'), k=Math.max(c.width/im.naturalWidth,c.height/im.naturalHeight);
      var w=im.naturalWidth*k,h=im.naturalHeight*k; g.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h); scaled[s]=c;
    });
  }
  var loaded=0;
  list.forEach(function(s){ var im=new Image(); im.onload=function(){ if(++loaded===list.length) prepare(); }; im.src=s; imgs[s]=im; });
  addEventListener('resize',function(){ if(loaded===list.length) prepare(); });

  function mixOf(f){ return f<.35?0:f>.65?1:(f-.35)/.3; }
  // 1段分を、縦のレンズで左右に切り替えながら描く
  function drawRow(g,r,sx,sy){
    var P=Math.max(2,Math.round(LOOK.pitch*DPR)), n=Math.ceil(W/P);
    for(var c=0;c<n;c++){
      var x=c*P, u=x/W;
      var p=Math.max(0,Math.min(cols-1,curX+(u-.5)*LOOK.sweep));
      var a=Math.floor(p), b=Math.min(cols-1,a+1), m=mixOf(p-a);
      var wb=Math.round(P*m), wa=P-wb;
      var A=scaled[GRID[r][a]], B=scaled[GRID[r][b]];
      if(wa>0) g.drawImage(A,x+sx,sy,wa,H,x,0,wa,H);
      if(wb>0) g.drawImage(B,x+wa+sx,sy,wb,H,x+wa,0,wb,H);
      if(LOOK.ghost>0&&a!==b){ g.globalAlpha=LOOK.ghost; g.drawImage(m<.5?B:A,x+sx,sy,P,H,x,0,P,H); g.globalAlpha=1; }
    }
  }
  function drawFrame(){
    if(loaded<list.length||!scaled[list[0]]) return;
    var t=(curX-cx)/cx||0, v=(curY-cy)/cy||0;
    var sx=Math.round(ex+t*W*LOOK.parallax), sy=Math.round(ey+v*H*LOOK.parallax);
    var a=Math.floor(curY), b=Math.min(rows-1,a+1), m=mixOf(curY-a);
    var top=m<1?a:b;
    drawRow(ctx,top,sx,sy);
    if(m>0&&m<1){
      // 前後の切り替え：横のレンズで次の段を重ねる
      drawRow(octx,b,sx,sy);
      var P=Math.max(2,Math.round(LOOK.pitch*DPR)), hb=Math.round(P*m);
      if(hb>0) for(var y=0;y<H;y+=P){ ctx.drawImage(off,0,y,W,hb,0,y,W,hb); }
    }
  }
  function step(){
    curX+=(tx-curX)*.18; curY+=(ty-curY)*.18;
    var t=(curX-cx)/cx||0, v=(curY-cy)/cy||0;
    card.style.setProperty('--t',t.toFixed(3)); card.style.setProperty('--v',v.toFixed(3));
    card.style.setProperty('--hl',(((t*3)%1+1)%1).toFixed(3)); card.style.setProperty('--hlv',(((v*3)%1+1)%1).toFixed(3));
    drawFrame(); requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  function tiltXY(e){
    var ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    if(ang===90) return [e.beta,-e.gamma]; if(ang===-90||ang===270) return [-e.beta,e.gamma];
    return [e.gamma,e.beta];
  }
  function onOrient(e){
    if(e.gamma==null||e.beta==null) return;
    events++; var xy=tiltXY(e); lastG=xy[0]; lastB=xy[1];
    if(base===null){ base=xy[0]; baseB=xy[1]; }
    tx=Math.max(0,Math.min(cols-1.001,cx+(xy[0]-base)/LOOK.degX));
    ty=Math.max(0,Math.min(rows-1.001,cy+(xy[1]-baseB)/LOOK.degY));
  }
  var listening=false;
  function listen(){ if(!listening){ listening=true; addEventListener('deviceorientation',onOrient,true); } }
  var needsPermission=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
  if(!needsPermission){ listen(); perm='不要'; }
  card.addEventListener('click',function(){
    if(needsPermission&&perm!=='granted'){
      try{ DeviceOrientationEvent.requestPermission().then(function(r){ perm=r; if(r==='granted') listen(); }).catch(function(x){ perm='エラー:'+(x&&x.message||x); }); }
      catch(x){ perm='エラー:'+(x&&x.message||x); }
      return;
    }
    base=null;
  });

  if(/debug/.test(location.search)){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;left:8px;top:40px;z-index:9;margin:0;padding:8px;background:rgba(0,0,0,.7);color:#0f0;font:12px monospace;white-space:pre-wrap;max-width:90vw;pointer-events:none';
    document.body.appendChild(d);
    setInterval(function(){d.textContent='版: 9dir-v1\n許可結果: '+perm+'\nセンサー受信: '+events+'回\n左右: '+(lastG==null?'-':lastG.toFixed(1))+' 前後: '+(lastB==null?'-':lastB.toFixed(1))+'\n位置: '+curX.toFixed(2)+', '+curY.toFixed(2);},300);
  }
})();
</script>
</body>
</html>
