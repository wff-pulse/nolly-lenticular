<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ノーリー レンチキュラー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
.card{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* レンズの筋（縦）＋うっすら横の筋：縦横どちらに傾けても変わるレンズ */
.ridges{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.55;
  background-image:linear-gradient(90deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(255,255,255,0) 40%,rgba(255,255,255,.75) 52%,rgba(255,255,255,0) 64%,rgba(0,0,0,0) 80%,rgba(0,0,0,.5) 100%);
  background-size:var(--p,4px) 100%;background-position:calc(var(--hl,0) * var(--p,4px)) 0}
.ridgesH{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.25;
  background-image:linear-gradient(0deg,rgba(0,0,0,.5) 0,rgba(0,0,0,0) 25%,rgba(255,255,255,.6) 50%,rgba(0,0,0,0) 75%,rgba(0,0,0,.5) 100%);
  background-size:100% var(--p,4px);background-position:0 calc(var(--hlv,0) * var(--p,4px))}
.rainbow{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;
  background:linear-gradient(130deg,transparent 20%,rgba(255,0,128,.55) 30%,rgba(255,200,0,.55) 38%,rgba(0,255,160,.55) 46%,rgba(0,170,255,.55) 54%,rgba(160,0,255,.55) 62%,transparent 72%);
  transform:translate(calc(var(--t,0) * 40%),calc(var(--v,0) * 30%))}
.glare{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 48%,rgba(255,255,255,.05) 53%,transparent 58%);
  transform:translate(calc(var(--t,0) * -55%),calc(var(--v,0) * -35%))}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(0,0,0,.35) 100%)}
/* はじめの説明画面 */
.intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));text-align:center;color:#fbf3e6;
  background:radial-gradient(ellipse at 50% 30%,#2f6b4d 0%,#1f4b37 55%,#15372a 100%);overflow:hidden;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;transition:opacity .5s ease}
.intro.hide{opacity:0;pointer-events:none}
.intro .howto{font-size:13px;letter-spacing:.12em;color:#d6e6d2;margin-bottom:-14px}
.intro h1 rt{font-size:11px;letter-spacing:.2em;color:#f2c9c4;font-weight:500;text-shadow:none}
.intro h1{margin:0;font-size:26px;letter-spacing:.06em;color:#fbf3e6;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.intro ol{margin:0;padding:0;list-style:none;display:grid;gap:14px;max-width:320px;text-align:left}
.intro li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.6}
.intro li b{flex:none;width:28px;height:28px;border-radius:50%;background:#c94a50;color:#fff;display:grid;place-items:center;font-size:15px}
.intro small{display:block;font-size:12.5px;color:#cfe0cc}
.cross{position:relative;width:132px;height:132px}
.cross span{position:absolute;font-size:24px;color:#e8a09c;animation:nudge 1.6s ease-in-out infinite}
.cross .u{top:0;left:50%;transform:translateX(-50%)}.cross .d{bottom:0;left:50%;transform:translateX(-50%)}
.cross .l{left:0;top:50%;transform:translateY(-50%)}.cross .r{right:0;top:50%;transform:translateY(-50%)}
.cross i{position:absolute;inset:38px;border-radius:12px;border:2px solid #fbf3e6;background:rgba(255,255,255,.08);color:#fbf3e6;
  display:grid;place-items:center;text-align:center;font-style:normal;font-size:10.5px;line-height:1.3}
@keyframes nudge{50%{opacity:.35}}
.intro .tap{border:0;cursor:pointer;font-family:inherit;margin-top:4px;padding:14px 30px;border-radius:999px;background:#ffd77a;color:#fff;font-weight:700;font-size:17px;
  animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.sample-badge{position:absolute;z-index:6;pointer-events:none;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);
  padding:6px 12px;border-radius:6px;background:rgba(200,20,40,.85);color:#fff;font:700 13px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;text-align:center}
.sample-badge small{display:block;font-size:10px;letter-spacing:.05em;font-weight:600}
.hint{position:absolute;z-index:7;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);
  padding:9px 18px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:600 14px/1.2 "Hiragino Sans","Noto Sans JP",sans-serif;
  pointer-events:none;white-space:nowrap;transition:opacity .5s;animation:pulse 1.8s ease-in-out infinite}
.hint.hide{opacity:0}
/* ── クリスマスの飾り ── */
.intro>*{position:relative;z-index:2}
.intro .snow{position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
.lights{position:absolute!important;top:0;left:-10px;right:-10px;height:70px;z-index:3!important;pointer-events:none}
.lights svg{width:100%;height:100%;overflow:visible}
.lights .bulb{position:absolute;width:9px;height:12px;border-radius:50% 50% 45% 45%;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.6}}
.bells{display:flex;gap:4px;justify-content:center;margin-bottom:-10px}
.bells svg{width:42px;height:48px;transform-origin:50% 4px;animation:ring 2.4s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.bells svg:last-child{animation-delay:-1.2s}
@keyframes ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.holly{position:absolute!important;bottom:-6px;width:120px;height:90px;z-index:2;pointer-events:none;opacity:.85}
.holly.left{left:-8px}.holly.right{right:-8px;transform:scaleX(-1)}
.intro .tap{background:linear-gradient(180deg,#d4585e,#b43f46);box-shadow:0 6px 16px rgba(0,0,0,.25)!important}
@media (prefers-reduced-motion:reduce){.bells svg,.lights .bulb{animation:none}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.cross span,.intro .tap{animation:none}}
</style>
</head>
<body>
<div class="card" id="card" onclick="void 0">
  <canvas id="cv"></canvas>
  <div class="ridges"></div><div class="ridgesH"></div><div class="rainbow"></div><div class="glare"></div><div class="vignette"></div>
  
  <div class="hint" id="hint">画面をタップしてね</div>
  <div class="intro" id="intro" role="dialog" aria-label="NOLLYのクリスマス 楽しみ方">
    <canvas class="snow" id="snow"></canvas>
    <div class="lights" aria-hidden="true"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M0 12 Q10 30 20 16 T40 16 T60 16 T80 16 T100 12" stroke="#8fbf8a" stroke-width="1.2" fill="none"/></svg><span class="bulb" style="left:4.0%;top:26px;background:#e0565b;box-shadow:0 0 6px 1px #e0565b;animation-delay:0.0s"></span><span class="bulb" style="left:12.4%;top:36px;background:#e9c46a;box-shadow:0 0 6px 1px #e9c46a;animation:none"></span><span class="bulb" style="left:20.8%;top:26px;background:#f4ead8;box-shadow:0 0 6px 1px #f4ead8;animation-delay:1.0s"></span><span class="bulb" style="left:29.2%;top:36px;background:#6fbf73;box-shadow:0 0 6px 1px #6fbf73;animation-delay:0.0s"></span><span class="bulb" style="left:37.6%;top:26px;background:#e0565b;box-shadow:0 0 6px 1px #e0565b;animation-delay:0.5s"></span><span class="bulb" style="left:46.0%;top:36px;background:#e0565b;box-shadow:0 0 6px 1px #e0565b;animation-delay:1.0s"></span><span class="bulb" style="left:54.4%;top:26px;background:#e9c46a;box-shadow:0 0 6px 1px #e9c46a;animation:none"></span><span class="bulb" style="left:62.8%;top:36px;background:#f4ead8;box-shadow:0 0 6px 1px #f4ead8;animation-delay:0.5s"></span><span class="bulb" style="left:71.2%;top:26px;background:#6fbf73;box-shadow:0 0 6px 1px #6fbf73;animation-delay:1.0s"></span><span class="bulb" style="left:79.6%;top:36px;background:#e0565b;box-shadow:0 0 6px 1px #e0565b;animation-delay:0.0s"></span><span class="bulb" style="left:88.0%;top:26px;background:#e0565b;box-shadow:0 0 6px 1px #e0565b;animation-delay:0.5s"></span><span class="bulb" style="left:96.4%;top:36px;background:#e9c46a;box-shadow:0 0 6px 1px #e9c46a;animation:none"></span></div>
    <svg class="holly left" viewBox="0 0 120 90" aria-hidden="true"><g fill="#4f9a62" stroke="#a9d6a8" stroke-width="1"><path d="M8 80c10-22 30-30 52-26-6 4-4 10-12 10 4 6-2 10-10 8 2 8-6 10-12 6-4 6-12 6-18 2z"/><path d="M60 70c4-22 22-36 46-36-6 6-2 12-10 14 6 6 0 12-8 10 2 8-6 12-12 6-2 8-10 10-16 6z"/></g><g fill="#d9484f"><circle cx="54" cy="62" r="6"/><circle cx="64" cy="58" r="6"/><circle cx="58" cy="72" r="6"/></g><g fill="#fff" opacity=".7"><circle cx="52" cy="60" r="1.6"/><circle cx="62" cy="56" r="1.6"/><circle cx="56" cy="70" r="1.6"/></g></svg><svg class="holly right" viewBox="0 0 120 90" aria-hidden="true"><g fill="#4f9a62" stroke="#a9d6a8" stroke-width="1"><path d="M8 80c10-22 30-30 52-26-6 4-4 10-12 10 4 6-2 10-10 8 2 8-6 10-12 6-4 6-12 6-18 2z"/><path d="M60 70c4-22 22-36 46-36-6 6-2 12-10 14 6 6 0 12-8 10 2 8-6 12-12 6-2 8-10 10-16 6z"/></g><g fill="#d9484f"><circle cx="54" cy="62" r="6"/><circle cx="64" cy="58" r="6"/><circle cx="58" cy="72" r="6"/></g><g fill="#fff" opacity=".7"><circle cx="52" cy="60" r="1.6"/><circle cx="62" cy="56" r="1.6"/><circle cx="56" cy="70" r="1.6"/></g></svg>
    <div class="bells"><svg viewBox="0 0 42 48" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" x2="1"><stop offset="0" stop-color="#b8862b"/><stop offset=".45" stop-color="#ffe08a"/><stop offset="1" stop-color="#a8741c"/></linearGradient></defs><path d="M21 2c2 0 3 1 3 3v2c7 2 11 8 11 16v9l4 6H3l4-6v-9c0-8 4-14 11-16V5c0-2 1-3 3-3z" fill="url(#bg1)"/><circle cx="21" cy="42" r="4.2" fill="#c8922e"/><path d="M14 9c6-3 14-3 20 1" stroke="#c7263a" stroke-width="3" fill="none" stroke-linecap="round"/></svg><svg viewBox="0 0 42 48" aria-hidden="true"><defs><linearGradient id="bg2" x1="0" x2="1"><stop offset="0" stop-color="#b8862b"/><stop offset=".45" stop-color="#ffe08a"/><stop offset="1" stop-color="#a8741c"/></linearGradient></defs><path d="M21 2c2 0 3 1 3 3v2c7 2 11 8 11 16v9l4 6H3l4-6v-9c0-8 4-14 11-16V5c0-2 1-3 3-3z" fill="url(#bg2)"/><circle cx="21" cy="42" r="4.2" fill="#c8922e"/><path d="M14 9c6-3 14-3 20 1" stroke="#c7263a" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>
    <div class="howto">デジタルレンチキュラーの楽しみ方</div>
    <h1><ruby>NOLLY<rt>ノーリー</rt></ruby>のクリスマス</h1>
    <div class="cross" aria-hidden="true"><span class="l">◀</span><span class="r">▶</span><i>スマート<br>フォン</i></div>
    <ol>
      <li><b>1</b><div>表紙が出たら、画面のどこかをタップしてね<small>スマートフォンに「動きと方向へのアクセス」などの確認が出たら「許可」を押してね</small></div></li>
      <li><b>2</b><div>スマートフォンを<strong>左右</strong>に傾けてみてね<small>傾けた方向ごとに、ちがうノーリーが見られるよ</small></div></li>
    </ol>
    <button type="button" class="tap" id="introOk">わかった！表紙を見る</button>
  </div>
</div>
<script>
(function(){
  /* ===== 作品ごとの設定 =====
     GRID：傾けた方向に出る絵（上段＝奥に倒す／下段＝手前に倒す、左列＝左に倒す／右列＝右に倒す）
     日本地図のおおよその方角：中央＝富士山（中部） */
  // 十字の5枚：中央＝表紙（Merry Christmas）。斜めの角には表紙を置き、斜めに傾けた時も崩れないようにする
  // 3枚：左＝ツリーの星に手をのばす ／ 中央＝表紙（Merry Christmas）／ 右＝毛布でうとうと
  var GRID=[
    ['xmas3-left-v2.jpg','xmas3-cover.jpg','xmas3-right.jpg']
  ];
  var LOOK={
    pitch:4,       // レンズ1本の幅（px）
    degX:13,       // 左右：何度傾けると隣の絵になるか
    degY:13,       // 前後：何度傾けると隣の絵になるか
    sweep:.45,     // 切り替わりが画面を流れる強さ
    ghost:.08,     // 隣の絵がうっすら残る強さ
    parallax:.015  // 傾けた時に絵がわずかにずれる量
  };
  /* ========================= */
  var card=document.getElementById('card'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var rows=GRID.length, cols=GRID[0].length;
  var imgs={}, scaled={}, W=0,H=0,DPR=1, ex=0, ey=0;
  var off=document.createElement('canvas'), octx=off.getContext('2d');
  var cx=(cols-1)/2, cy=(rows-1)/2, tx=cx, ty=cy, curX=cx, curY=cy;
  var base=null, baseB=null, events=0, lastG=null, lastB=null, perm='未';
  card.style.setProperty('--p',LOOK.pitch+'px');

  var list=[]; GRID.forEach(function(r){r.forEach(function(s){ if(list.indexOf(s)<0) list.push(s); });});
  function prepare(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.round(innerWidth*DPR); H=Math.round(innerHeight*DPR);
    cv.width=off.width=W; cv.height=off.height=H;
    ex=Math.round(W*LOOK.parallax*2); ey=Math.round(H*LOOK.parallax*2);
    list.forEach(function(s){
      var im=imgs[s]; var c=document.createElement('canvas'); c.width=W+ex*2; c.height=H+ey*2;
      var g=c.getContext('2d'), k=Math.max(c.width/im.naturalWidth,c.height/im.naturalHeight);
      var w=im.naturalWidth*k,h=im.naturalHeight*k; g.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h); scaled[s]=c;
    });
  }
  var loaded=0;
  list.forEach(function(s){ var im=new Image(); im.onload=function(){ if(++loaded===list.length) prepare(); }; im.src=s; imgs[s]=im; });
  addEventListener('resize',function(){ if(loaded===list.length) prepare(); });

  function mixOf(f){ return f<.35?0:f>.65?1:(f-.35)/.3; }
  // 1段分を、縦のレンズで左右に切り替えながら描く
  function drawRow(g,r,sx,sy){
    var P=Math.max(2,Math.round(LOOK.pitch*DPR)), n=Math.ceil(W/P);
    for(var c=0;c<n;c++){
      var x=c*P, u=x/W;
      var p=Math.max(0,Math.min(cols-1,curX+(u-.5)*LOOK.sweep));
      var a=Math.floor(p), b=Math.min(cols-1,a+1), m=mixOf(p-a);
      var wb=Math.round(P*m), wa=P-wb;
      var A=scaled[GRID[r][a]], B=scaled[GRID[r][b]];
      if(wa>0) g.drawImage(A,x+sx,sy,wa,H,x,0,wa,H);
      if(wb>0) g.drawImage(B,x+wa+sx,sy,wb,H,x+wa,0,wb,H);
      if(LOOK.ghost>0&&a!==b){ g.globalAlpha=LOOK.ghost; g.drawImage(m<.5?B:A,x+sx,sy,P,H,x,0,P,H); g.globalAlpha=1; }
    }
  }
  function drawFrame(){
    if(loaded<list.length||!scaled[list[0]]) return;
    var t=(curX-cx)/cx||0, v=(curY-cy)/cy||0;
    var sx=Math.round(ex+t*W*LOOK.parallax), sy=Math.round(ey+v*H*LOOK.parallax);
    var a=Math.floor(curY), b=Math.min(rows-1,a+1), m=mixOf(curY-a);
    var top=m<1?a:b;
    drawRow(ctx,top,sx,sy);
    if(m>0&&m<1){
      // 前後の切り替え：横のレンズで次の段を重ねる
      drawRow(octx,b,sx,sy);
      var P=Math.max(2,Math.round(LOOK.pitch*DPR)), hb=Math.round(P*m);
      if(hb>0) for(var y=0;y<H;y+=P){ ctx.drawImage(off,0,y,W,hb,0,y,W,hb); }
    }
  }
  function step(){
    curX+=(tx-curX)*.18; curY+=(ty-curY)*.18;
    var t=(curX-cx)/cx||0, v=(curY-cy)/cy||0;
    card.style.setProperty('--t',t.toFixed(3)); card.style.setProperty('--v',v.toFixed(3));
    card.style.setProperty('--hl',(((t*3)%1+1)%1).toFixed(3)); card.style.setProperty('--hlv',(((v*3)%1+1)%1).toFixed(3));
    drawFrame(); requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  function tiltXY(e){
    var ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    if(ang===90) return [e.beta,-e.gamma]; if(ang===-90||ang===270) return [-e.beta,e.gamma];
    return [e.gamma,e.beta];
  }
  function onOrient(e){
    if(e.gamma==null||e.beta==null) return;
    events++; var xy=tiltXY(e); lastG=xy[0]; lastB=xy[1];
    if(base===null){ base=xy[0]; baseB=xy[1]; }
    // 十字だけに動く：左右と上下のうち、大きく傾けた方だけを使う
    var dx=(xy[0]-base)/LOOK.degX, dy=0;   // 左右だけで切り替え
    tx=Math.max(0,Math.min(cols-1.001,cx+dx));
    ty=Math.max(0,Math.min(rows-1.001,cy+dy));
  }
  var listening=false;
  function listen(){ if(!listening){ listening=true; addEventListener('deviceorientation',onOrient,true); } }
  var needsPermission=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
  if(!needsPermission){ listen(); perm='不要'; }
  var intro=document.getElementById('intro'), hint=document.getElementById('hint');
  // 説明画面に雪を降らせる
  (function(){
    var cv=document.getElementById('snow'); if(!cv) return;
    var g=cv.getContext('2d'), fl=[], W=0, H=0, R=Math.min(window.devicePixelRatio||1,2), run=true;
    var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    function size(){ W=cv.width=intro.clientWidth*R; H=cv.height=intro.clientHeight*R; }
    size(); addEventListener('resize',size);
    for(var i=0;i<90;i++) fl.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.4,s:.15+Math.random()*.45,w:Math.random()*6.28});
    function draw(){
      if(!run||!document.body.contains(cv)) return;
      g.clearRect(0,0,W,H);
      for(var i=0;i<fl.length;i++){
        var f=fl[i];
        if(!still){ f.y+=f.s*0.0022*(1+f.r*.3); f.w+=0.02; f.x+=Math.sin(f.w)*0.0006; if(f.y>1.02){f.y=-0.02;f.x=Math.random();} }
        g.beginPath(); g.arc(f.x*W,f.y*H,f.r*R,0,6.283);
        g.fillStyle='rgba(255,255,255,'+(0.55+f.r*0.15)+')'; g.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  })();
  intro.addEventListener('click',function(ev){
    ev.stopPropagation();                       // ここでは傾きを始めない（説明を閉じるだけ）
    if(ev.target.id!=='introOk') return;        // ボタンを押した時だけ表紙へ
    intro.classList.add('hide'); setTimeout(function(){intro.remove();},600);
  });
  addEventListener('deviceorientation',function(e){ if(e.gamma!=null&&hint) hint.classList.add('hide'); });
  card.addEventListener('click',function(){
    if(needsPermission&&perm!=='granted'){
      try{ DeviceOrientationEvent.requestPermission().then(function(r){ perm=r; if(r==='granted') listen(); }).catch(function(x){ perm='エラー:'+(x&&x.message||x); }); }
      catch(x){ perm='エラー:'+(x&&x.message||x); }
      return;
    }
    base=null;
  });

  if(/debug/.test(location.search)){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;left:8px;top:40px;z-index:9;margin:0;padding:8px;background:rgba(0,0,0,.7);color:#0f0;font:12px monospace;white-space:pre-wrap;max-width:90vw;pointer-events:none';
    document.body.appendChild(d);
